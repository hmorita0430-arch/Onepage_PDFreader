<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b1f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>見開きリーダー</title>
  </head>
  <body>
    <main id="start" class="screen">
      <h1>見開きリーダー</h1>
      <p class="lead">見開きで撮影したPDFを、1ページずつ読みやすく表示します。</p>

      <button id="open-drive" class="primary" type="button">Googleドライブから開く</button>
      <button id="open-local" class="secondary" type="button" hidden>端末のPDFを開く(開発用)</button>
      <input id="local-input" type="file" accept="application/pdf" hidden />

      <div id="progress" class="progress" hidden role="progressbar" aria-label="ダウンロードの進捗">
        <div id="progress-bar"></div>
      </div>
      <p id="message" class="message" role="status"></p>

      <section class="library" aria-labelledby="library-title">
        <h2 id="library-title">端末に保存した本</h2>
        <ul id="library-list" class="library-list"></ul>
        <p id="library-empty" class="muted">まだありません。ドライブから開いた本は、自動で端末に保存されます。</p>
        <p id="storage-info" class="muted"></p>
      </section>

      <p class="conn">
        ドライブ: <span id="conn-start">未接続</span>
        <button id="reconnect-start" class="link" type="button" hidden>再接続</button>
      </p>
    </main>

    <div id="reader" class="reader" hidden>
      <div id="stage" class="stage"></div>

      <header id="topbar" class="bar top" hidden>
        <button id="back" class="icon" type="button" aria-label="本を閉じる">←</button>
        <span id="title" class="title"></span>
        <span class="conn small">
          <span id="conn-reader">未接続</span>
          <button id="reconnect-reader" class="link" type="button" hidden>再接続</button>
        </span>
        <button id="open-nav" class="icon" type="button" aria-label="ページ移動・しおり・サムネイル">☰</button>
        <button id="open-settings" class="icon" type="button" aria-label="本の設定">⚙</button>
      </header>

      <div id="sync-badge" class="sync-badge" role="status" aria-live="polite"></div>

      <footer id="bottombar" class="bar bottom" hidden>
        <span id="page-label"></span>
      </footer>

      <aside id="settings" class="settings" hidden aria-label="本の設定">
        <h2>本の設定</h2>
        <label>開き方向
          <select id="set-direction">
            <option value="rtl">右開き(右ページが先)</option>
            <option value="ltr">左開き(左ページが先)</option>
          </select>
        </label>
        <label>分割位置 <output id="split-out"></output>
          <input id="set-split" type="range" min="0.3" max="0.7" step="0.002" />
        </label>
        <label>1枚目(表紙など)
          <select id="set-first">
            <option value="both">左右とも本文</option>
            <option value="R">右側だけ</option>
            <option value="L">左側だけ</option>
          </select>
        </label>
        <label>横長画面の表示
          <select id="set-layout">
            <option value="single">1ページ</option>
            <option value="double">2ページ(撮影した見開きのまま)</option>
          </select>
        </label>
        <label class="check">
          <input id="set-zoomkeep" type="checkbox" />
          ズーム維持(ページを送っても倍率と位置を引き継ぐ)
        </label>
        <button id="open-crop" class="secondary" type="button">余白を設定…</button>
        <fieldset>
          <legend>印刷ページ番号との対応</legend>
          <label class="inline">通し番号 <input id="set-serial" type="number" min="1" inputmode="numeric" /></label>
          <label class="inline">= 印刷p. <input id="set-printed" type="number" inputmode="numeric" /></label>
          <button id="clear-printed" class="link" type="button">対応を消す</button>
        </fieldset>
        <fieldset>
          <legend>ドライブとの同期</legend>
          <p id="sync-status-text" class="muted"></p>
          <button id="sync-now" class="secondary" type="button">今すぐ同期</button>
        </fieldset>
        <button id="close-settings" class="primary" type="button">閉じる</button>
      </aside>
      <section id="nav" class="nav" hidden aria-label="ページ移動">
        <header class="nav-head">
          <div class="tabs" role="tablist">
            <button type="button" role="tab" data-tab="jump" aria-selected="true">移動</button>
            <button type="button" role="tab" data-tab="named" aria-selected="false">しおり・目次</button>
            <button type="button" role="tab" data-tab="thumbs" aria-selected="false">サムネイル</button>
          </div>
          <button id="nav-close" class="icon" type="button" aria-label="閉じる">✕</button>
        </header>

        <div id="nav-jump" class="nav-body">
          <p id="jump-now" class="muted"></p>
          <div class="jump-row">
            <select id="jump-mode" aria-label="番号の種類">
              <option value="serial">通し番号</option>
              <option value="printed">印刷ページ番号</option>
            </select>
            <input id="jump-input" type="number" min="1" inputmode="numeric" placeholder="番号" aria-label="移動先の番号" />
            <button id="jump-go" class="primary" type="button">移動</button>
          </div>
          <p id="jump-msg" class="message" role="status"></p>
          <p class="muted">印刷ページ番号は、本の設定の「印刷ページ番号との対応」を入れると選べます。</p>
        </div>

        <div id="nav-named" class="nav-body" hidden>
          <div class="named-form">
            <select id="named-kind" aria-label="種類">
              <option value="bookmark">しおり</option>
              <option value="toc">目次</option>
            </select>
            <input id="named-title" type="text" placeholder="名前(例: 第3章)" maxlength="80" aria-label="名前" />
            <button id="named-add" class="primary" type="button">いまのページを追加</button>
          </div>
          <p id="named-msg" class="message" role="status"></p>
          <h3>しおり</h3>
          <ul id="named-bookmarks" class="named-list"></ul>
          <h3>目次</h3>
          <ul id="named-toc" class="named-list"></ul>
        </div>

        <div id="nav-thumbs" class="nav-body thumbs" hidden>
          <div id="thumb-grid" class="thumb-grid"></div>
        </div>
      </section>
      <section id="crop-panel" class="crop-panel" hidden aria-label="余白の設定">
        <h2>余白の設定 <small>(表示中のページで確認しながら)</small></h2>
        <div class="crop-grid">
          <label>上 <output id="crop-top-out"></output><input id="crop-top" type="range" min="0" max="0.4" step="0.005" /></label>
          <label>下 <output id="crop-bottom-out"></output><input id="crop-bottom" type="range" min="0" max="0.4" step="0.005" /></label>
          <label>左 <output id="crop-left-out"></output><input id="crop-left" type="range" min="0" max="0.4" step="0.005" /></label>
          <label>右 <output id="crop-right-out"></output><input id="crop-right" type="range" min="0" max="0.4" step="0.005" /></label>
        </div>
        <div class="crop-actions">
          <button id="crop-save-frame" class="primary" type="button">この本の共通枠にする</button>
          <button id="crop-save-page" class="secondary" type="button">このページだけに適用</button>
          <button id="crop-clear-page" class="link" type="button">このページの個別設定を消す</button>
          <button id="crop-clear-frame" class="link" type="button">共通枠を消す</button>
          <button id="crop-done" class="secondary" type="button">完了</button>
        </div>
        <p id="crop-msg" class="message" role="status"></p>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
